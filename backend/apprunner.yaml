version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 2
  network:
    port: 8080
    env: APP_PORT
  env:
    - name: APP_ENV
      value: production
    - name: LOG_LEVEL
      value: INFO
